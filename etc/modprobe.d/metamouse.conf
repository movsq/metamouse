# metamouse module parameters.
#
# The target mouse is matched by USB VID/PID baked into the driver's id_table
# (edit metamouse.c for a different device). These options only tune the remap:
#
#   src_usage    HID usage to remap from. 0x00090005 = Button page, button 5,
#                the forward thumb button on this mouse. For button N use
#                0x00090000 | N (e.g. back button 4 = 0x00090004).
#   dst_keycode  input keycode to emit (125 = KEY_LEFTMETA = Super/Mod4).
#
options metamouse src_usage=0x00090005 dst_keycode=125
