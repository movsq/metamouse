# metamouse module parameters.
#
# Find the values for your own device first (see README.md):
#   src_code     run `evtest`, select the mouse, press the button to remap
#   target_name  the "Name" field from `cat /proc/bus/input/devices`
#   dst_code     the keycode to emit (125 = KEY_LEFTMETA, i.e. Super/Mod4)
#
# target_name is optional: omit it to match any device that already emits
# src_code, or set it to pin the remap to one specific device.

options metamouse src_code=276 dst_code=125
# options metamouse src_code=276 dst_code=125 target_name="Exact Device Name"
