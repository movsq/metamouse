# metamouse module parameters. The mice to bind are listed by USB VID:PID in
# metamouse.c (id_table); these options only choose the remap:
#
#   src_usage    HID usage to remap from: 0x00090000 | N = mouse button N
#                (5 = forward thumb button, 4 = back).
#   dst_keycode  input keycode to emit (125 = KEY_LEFTMETA = Super/Mod4).
#
options metamouse src_usage=0x00090005 dst_keycode=125
